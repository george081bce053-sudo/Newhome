[platformio]
; 'pio run' with no -e flag only builds the real firmware targets.
; 'native' is a test-only environment - run it explicitly with
; 'pio test -e native' (or 'pio run -e native' if you really want to).
default_envs = esp32dev, esp32s3dev

[common]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_FREERTOS_UNICORE=0
    -DASYNCWEBSERVER_REGEX
lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.1.0
    ESP32Async/AsyncTCP @ ^3.2.0
    bblanchon/ArduinoJson @ ^7.1.0

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv

[env:esp32s3dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
build_flags =
    ${common.build_flags}
    -DSHAKE_TABLE_BOARD_S3
lib_deps = ${common.lib_deps}
board_build.filesystem = littlefs

; --- OTA (WiFi) upload envs ---
; Not in default_envs, so plain 'pio run' never touches these - use them
; explicitly. Requires your computer to be joined to the device's SoftAP
; at flash time (192.168.4.1 is the ESP32 SoftAP's default gateway IP,
; unaffected by any WiFi credential changes you make in Settings).
;
; Set OTA_PASSWORD to your current Settings password before running:
;   Windows (PowerShell):  $env:OTA_PASSWORD="yourpassword"
;   macOS/Linux/Codespace: export OTA_PASSWORD=yourpassword
; Then:
;   pio run -e esp32dev_ota -t upload      (or esp32s3dev_ota)
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}

[env:esp32s3dev_ota]
extends = env:esp32s3dev
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}

[env:native]
platform = native
test_framework = unity
; Only test/ is compiled here - src/ is intentionally NOT built for this
; env, since most of src/ depends on real Arduino/FreeRTOS/ESP-IDF headers
; that don't exist on a desktop compiler. Tests reach into src/ directly
; via #include for the handful of headers that are pure logic (currently
; just MotionMath.h). See test/native_mocks/README.md for details.
build_flags =
    -Itest/native_mocks
    -std=c++17
    -DUNITY_INCLUDE_DOUBLE
